appId: com.moirasia.desktop
productName: Moirasia
afterPack: scripts/sign-after-pack.mjs
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: native/staged/application-agent
    to: application-agent
  - from: native/staged/features/ExithibitionNative
    to: native/ExithibitionNative
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  minimumSystemVersion: "14.0"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSMinimumSystemVersion: "14.0"
asar: true

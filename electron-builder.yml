appId: com.moirasia.desktop
productName: Moirasia
afterPack: scripts/sign-after-pack.mjs
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/trayTemplate.png
    to: tray/trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: tray/trayTemplate@2x.png
  - from: native/staged/application-agent
    to: application-agent
  - from: native/staged/features/amove/native
    to: features/amove/native
  - from: native/staged/features/amove/assets
    to: features/amove/assets
  - from: native/staged/features/bonded/native
    to: features/bonded/native
  - from: native/staged/features/shout/native
    to: features/shout/native
  - from: native/staged/features/shout/driver
    to: features/shout/driver
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  minimumSystemVersion: "14.0"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSMinimumSystemVersion: "14.0"
    NSMicrophoneUsageDescription: "Moirasia's Shout feature boosts your microphone. It needs microphone access to feed the amplified signal into the Shout Mic input device."
asar: true

appId: com.moirasia.desktop
productName: Moirasia
afterPack: scripts/sign-after-pack.mjs
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: native/staged/application-agent
    to: application-agent
  - from: native/staged/features/ExithibitionNative
    to: native/ExithibitionNative
  - from: native/staged/features/amove/native
    to: features/amove/native
  - from: native/staged/features/amove/assets
    to: features/amove/assets
  - from: native/staged/features/bonded/native
    to: features/bonded/native
  - from: native/staged/features/orbis/worker
    to: features/orbis/worker
  - from: native/staged/features/orbis/native
    to: features/orbis/native
    filter:
      - '*.node'
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  minimumSystemVersion: "14.0"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSMinimumSystemVersion: "14.0"
asar: true

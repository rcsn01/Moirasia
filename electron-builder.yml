appId: com.moirasia.desktop
productName: Moirasia
afterPack: scripts/sign-after-pack.mjs
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: build/trayTemplate.png
    to: tray/trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: tray/trayTemplate@2x.png
  - from: native/staged/application-agent
    to: application-agent
  - from: native/staged/runtime/MoirasiaFeatureService.app
    to: runtime/MoirasiaFeatureService.app
  - from: native/staged/runtime/MoirasiaFeatureService
    to: runtime/MoirasiaFeatureService
  - from: native/staged/runtime/MoirasiaHost
    to: runtime/MoirasiaHost
  - from: native/staged/features
    to: features
# The host bundle lives in Contents/Library/LoginItems so launch-at-login can
# start it as a login item service.
extraFiles:
  - from: native/staged/runtime/MoirasiaHost.app
    to: Library/LoginItems/MoirasiaHost.app
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  minimumSystemVersion: "14.0"
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSMinimumSystemVersion: "14.0"
    NSMicrophoneUsageDescription: "Moirasia's Shout feature boosts your microphone. It needs microphone access to feed the amplified signal into the Shout Mic input device."
asar: true
